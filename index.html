<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Achadinhos Shopee</title>
  <meta name="description" content="Meus links de achadinhos da Shopee" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #8a8a8a;
      --line: #ececec;
      --soft: #f6f6f6;
      --accent: #ee4d2d; /* laranja Shopee */
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 14px 48px; }

    /* ---------- Perfil ---------- */
    header { text-align: center; padding: 36px 0 18px; }
    .avatar {
      width: 92px; height: 92px; border-radius: 50%;
      object-fit: cover; background: var(--soft);
      display: block; margin: 0 auto 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
    .bio { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
    .social { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    .social a {
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid var(--line); color: var(--text);
    }
    .social svg { width: 18px; height: 18px; fill: currentColor; }

    /* ---------- Busca ---------- */
    .search-bar {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      padding: 10px 0 10px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
    }
    .search {
      position: relative; display: flex; align-items: center;
    }
    .search svg {
      position: absolute; left: 16px; width: 20px; height: 20px;
      stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none;
    }
    .search input {
      width: 100%; height: 52px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--soft);
      padding: 0 48px 0 46px;
      font-size: 16px; /* evita zoom no iOS */
      color: var(--text); outline: none;
      -webkit-appearance: none; appearance: none;
      transition: border-color .15s, background .15s;
    }
    .search input:focus { border-color: var(--text); background: var(--bg); }
    .search input::-webkit-search-cancel-button { display: none; }
    .clear {
      position: absolute; right: 8px;
      width: 36px; height: 36px; border-radius: 50%;
      border: 0; background: transparent; color: var(--muted);
      font-size: 22px; line-height: 1; cursor: pointer;
    }

    .chips {
      display: flex; gap: 8px; overflow-x: auto;
      padding-top: 10px; scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--line); background: var(--bg);
      color: var(--text); border-radius: 999px;
      padding: 8px 14px; font-size: 0.875rem; cursor: pointer;
      font-family: inherit;
    }
    .chip[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }

    .meta {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font-size: 0.85rem; padding: 6px 2px 12px;
    }
    .view-toggle { display: flex; gap: 4px; }
    .view-toggle button {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); cursor: pointer; display: grid; place-items: center;
    }
    .view-toggle button[aria-pressed="true"] { border-color: var(--line); color: var(--text); }
    .view-toggle svg { width: 18px; height: 18px; fill: currentColor; }

    /* ---------- Grade de produtos ---------- */
    .grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .grid.one { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .grid.one { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card {
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .thumb {
      position: relative; aspect-ratio: 1 / 1;
      border-radius: var(--radius); overflow: hidden;
      background: var(--soft);
    }
    .thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .3s ease;
    }
    .card:active .thumb img { transform: scale(0.98); }
    @media (hover: hover) { .card:hover .thumb img { transform: scale(1.04); } }
    .num {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,.92); color: var(--text);
      font-size: 0.8rem; font-weight: 700;
      padding: 4px 9px; border-radius: 999px;
    }
    .info {
      flex: 1; display: flex; flex-direction: column;
      padding: 10px 2px 0;
    }
    .name {
      font-size: 0.95rem; font-weight: 500; line-height: 1.3;
      min-height: 2.6em; /* sempre 2 linhas: alinha preço e botão entre os cards */
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .grid.one .name { font-size: 1.05rem; min-height: 0; }
    /* Descrição só aparece no modo 1 coluna, para manter a grade limpa */
    .desc { display: none; }
    .grid.one .desc {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      color: var(--muted); font-size: 0.9rem; margin-top: 4px;
    }
    .row { flex: 1; padding: 4px 0 10px; } /* cresce e empurra o botão pro rodapé do card */
    .price { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
    .buy {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 40px; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 0.875rem; font-weight: 600; white-space: nowrap;
      transition: filter .15s;
    }
    .grid.one .buy { height: 48px; font-size: 1rem; }
    @media (hover: hover) { .card:hover .buy { filter: brightness(0.92); } }
    .card:active .buy { filter: brightness(0.88); }

    .empty { text-align: center; color: var(--muted); padding: 60px 20px; display: none; }
    .empty strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

    footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding-top: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" id="avatar" alt="" />
      <h1 id="nome"></h1>
      <p class="bio" id="bio"></p>
      <div class="social" id="social"></div>
    </header>

    <div class="search-bar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off"
               placeholder="Pesquisar produto ou número…" aria-label="Pesquisar produto" />
        <button class="clear" id="clear" type="button" aria-label="Limpar busca" hidden>&times;</button>
      </label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="meta">
      <span id="count"></span>
      <div class="view-toggle">
        <button type="button" data-view="two" aria-label="Duas colunas" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </button>
        <button type="button" data-view="one" aria-label="Uma coluna (fotos maiores)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
        </button>
      </div>
    </div>

    <main class="grid" id="grid"></main>

    <div class="empty" id="empty">
      <strong>Nenhum produto encontrado</strong>
      Tente outra palavra ou o número do produto.
    </div>

    <footer>Links de afiliado · posso receber comissão pelas compras</footer>
  </div>

  <!-- ?v= evita que o navegador mostre uma lista de produtos antiga -->
  <script>document.write('<script src="produtos.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#f6f6f6"/><path d="M38 40h24l-2 22H40z" fill="none" stroke="#cfcfcf" stroke-width="3" stroke-linejoin="round"/><path d="M44 40a6 6 0 0 1 12 0" fill="none" stroke="#cfcfcf" stroke-width="3"/></svg>'
    );

    const $ = (id) => document.getElementById(id);
    const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

    // ---------- Perfil ----------
    $("nome").textContent = PERFIL.nome;
    $("bio").textContent = PERFIL.descricao;
    document.title = PERFIL.nome + " · Achadinhos";
    $("avatar").src = PERFIL.foto || PLACEHOLDER;
    $("avatar").onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };

    const ICONS = {
      instagram: '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3 0-4.1.1C4.3 2.3 2.3 4.3 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.6 2.2 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.6-.2 5.6-2.2 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.6-2.2-5.6-5.8-5.8C15 2 14.7 2 12 2Zm0 1.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.7-.1-4-1.4-4.1-4.1-.1-1-.1-1.3-.1-4s0-3 .1-4C4 5.3 5.3 4 8 3.9c1-.1 1.3-.1 4-.1Z"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .8.1V9.2a6.2 6.2 0 1 0 5.4 6.2V8.6a7.6 7.6 0 0 0 4.4 1.4V6.7a4.4 4.4 0 0 1-4.4-4.4Z"/></svg>',
    };
    ["instagram", "tiktok"].forEach((k) => {
      if (!PERFIL[k]) return;
      const a = document.createElement("a");
      a.href = PERFIL[k]; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", k);
      a.innerHTML = ICONS[k];
      $("social").appendChild(a);
    });

    // ---------- Produtos ----------
    const items = PRODUTOS.map((p) => ({
      ...p,
      _busca: norm([p.nome, p.descricao, p.categoria, (p.tags || []).join(" "), p.numero].join(" ")),
    }));

    // Cria os cards uma vez; a busca só mostra/esconde
    const grid = $("grid");
    items.forEach((p) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = p.link;
      a.target = "_blank";
      a.rel = "noopener nofollow sponsored";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = p.imagem || PLACEHOLDER;
      img.alt = p.nome;
      img.loading = "lazy";
      img.decoding = "async";
      img.onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };
      thumb.appendChild(img);
      if (p.numero != null) {
        const n = document.createElement("span");
        n.className = "num";
        n.textContent = "#" + p.numero;
        thumb.appendChild(n);
      }

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.nome;
      const row = document.createElement("div");
      row.className = "row";
      const price = document.createElement("span");
      price.className = "price";
      price.textContent = p.preco || "";
      const buy = document.createElement("span");
      buy.className = "buy";
      buy.textContent = "Compre agora";
      row.append(price);
      info.append(name);
      if (p.descricao) {
        const desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = p.descricao;
        info.append(desc);
      }
      info.append(row, buy);

      a.append(thumb, info);
      grid.appendChild(a);
      p._el = a;
    });

    // ---------- Categorias ----------
    let categoria = "";
    const cats = [...new Set(items.map((p) => p.categoria).filter(Boolean))];
    if (cats.length > 1) {
      ["Todos", ...cats].forEach((c, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = c;
        b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
        b.onclick = () => {
          categoria = i === 0 ? "" : c;
          document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
          filtrar();
        };
        $("chips").appendChild(b);
      });
    } else {
      $("chips").hidden = true;
    }

    // ---------- Busca ----------
    const q = $("q");
    function filtrar() {
      const termos = norm(q.value).trim().split(/\s+/).filter(Boolean);
      let visiveis = 0;
      items.forEach((p) => {
        const ok = (!categoria || p.categoria === categoria) &&
                   termos.every((t) => p._busca.includes(t));
        p._el.hidden = !ok;
        if (ok) visiveis++;
      });
      $("count").textContent = visiveis + (visiveis === 1 ? " produto" : " produtos");
      $("empty").style.display = visiveis ? "none" : "block";
      $("clear").hidden = !q.value;
    }
    q.addEventListener("input", filtrar);
    $("clear").onclick = () => { q.value = ""; filtrar(); q.focus(); };

    // Permite link direto com busca: index.html?q=garrafa
    const inicial = new URLSearchParams(location.search).get("q");
    if (inicial) q.value = inicial;
    filtrar();

    // ---------- Alternar 1 ou 2 colunas ----------
    function setView(v) {
      grid.classList.toggle("one", v === "one");
      document.querySelectorAll(".view-toggle button").forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.view === v ? "true" : "false"));
      try { localStorage.setItem("view", v); } catch (e) {}
    }
    document.querySelectorAll(".view-toggle button").forEach((b) => (b.onclick = () => setView(b.dataset.view)));
    try { const v = localStorage.getItem("view"); if (v) setView(v); } catch (e) {}
  </script>
</body>
</html>
